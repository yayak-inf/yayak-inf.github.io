 margin: 0;

<div data-object="true" data-object-type="textbox" style="position: absolute; left: 140px; top: 560px; width: 220px; height: 30px; z-index: 8; text-align: center;">

<div style="background-color: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-left: 8px solid #1e3a8a; width: 100%; height: 100%;"></div>
</div>
<!-- Icon Container 1 -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 600px; top: 240px; width: 80px; height: 80px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<div style="background-color: #eff6ff; width: 80px; height: 80px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
<i class="fa-solid fa-desktop" style="font-size: 32px; color: #1e3a8a;"></i>
</div>
</div>
<!-- Text Content 1 -->

</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 710px; top: 275px; width: 420px; height: 80px; z-index: 10;">

        </p>
</div>

<div data-object="true" data-object-type="shape" style="position: absolute; left: 870px; top: 380px; width: 2px; height: 60px; z-index: 4;">

</div>
</div>

<div data-object="true" data-object-type="textbox" style="position: absolute; left: 710px; top: 515px; width: 420px; height: 100px; z-index: 10;">
<p style="font-family: 'Inter', sans-serif; font-weight: 400; font-size: 18px; line-height: 1.5; color: #64748b; margin: 0;">
            Menilai tingkat <strong>kemudahan penggunaan</strong> (usability) dan mengidentifikasi <strong>hambatan</strong> (pain points) yang dialami pengguna.
        </p>
</div>
<!-- Footer Page Number -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 1180px; top: 680px; width: 80px; height: 30px; z-index: 10; text-align: right;">
<p style="font-family: 'Inter', sans-serif; font-size: 14px; color: #94a3b8; margin: 0;">16</p>
</div>

<!-- NAVIGATION BUTTONS -->
<div style="
  position: absolute;
  bottom: 24px;
  right: 32px;
  display: flex;
  gap: 16px;
  z-index: 999;
">

    <button onclick="goPrev()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        ← Previous
    </button>

    <button onclick="goNext()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        Next →
    </button>

</div>

<script>
function goPrev() {
    window.location.href = "Slide 15.html";
}

function goNext() {
    window.location.href = "Slide 17.html";
}
</script>
