<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=1280, height=720, initial-scale=1.0" name="viewport"/>
<title>Cover Slide - Usability Testing &amp; UX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
        body {
           margin: 0;
  padding: 0;
  background-color: #0b1220;
  overflow: auto;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
        }
        .slide-container {
            position: relative;
            width: 1280px;
            height: 720px;
          
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Decorative Shapes -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 600px; top: -100px; width: 800px; height: 820px; z-index: 1;">
<svg fill="none" height="820" viewbox="0 0 800 820" width="800" xmlns="http://www.w3.org/2000/svg">
<path d="M145.5 0C65.1 0 0 65.1 0 145.5V820H800V0H145.5Z" fill="#eff6ff"></path>
<circle cx="650" cy="200" fill="#dbeafe" fill-opacity="0.5" r="150"></circle>
<circle cx="100" cy="750" fill="#bfdbfe" fill-opacity="0.5" r="50"></circle>
</svg>
</div>
<div data-object="true" data-object-type="shape" style="position: absolute; left: 850px; top: 0px; width: 430px; height: 720px; z-index: 2;">
<svg fill="none" height="720" viewbox="0 0 430 720" width="430" xmlns="http://www.w3.org/2000/svg">
<path d="M0 0H430V720H120L0 0Z" fill="#1e3a8a"></path>
<rect fill="#3b82f6" fill-opacity="0.3" height="4" width="300" x="50" y="100"></rect>
<rect fill="#3b82f6" fill-opacity="0.3" height="4" width="250" x="50" y="120"></rect>
<rect fill="#3b82f6" fill-opacity="0.3" height="4" width="200" x="50" y="140"></rect>
</svg>
</div>
<!-- Meeting Tag / Pill -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 80px; top: 80px; width: 200px; height: 40px; z-index: 5;">
<div style="background-color: #3b82f6; border-radius: 20px; width: 100%; height: 100%;"></div>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 80px; top: 86px; width: 200px; height: 30px; z-index: 10; text-align: center;">
<p style="font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; color: #ffffff; margin: 0; letter-spacing: 1px; text-transform: uppercase;">MATERI 10</p>
</div>
<!-- Main Title -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 80px; top: 180px; width: 750px; height: 260px; z-index: 10;">
<p style="font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 72px; line-height: 1.1; color: #1e3a8a; margin: 0;">
                Usability Testing <br/>
<span style="color: #3b82f6;">&amp;</span> User Experience <br/>
                (UX)
            </p>
</div>
<!-- Divider Line -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 80px; top: 460px; width: 100px; height: 6px; z-index: 5;">
<div style="background-color: #f59e0b; width: 100%; height: 100%; border-radius: 3px;"></div>
</div>
<!-- Course Info Section -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 80px; top: 500px; width: 600px; height: 180px; z-index: 10;">
<p style="font-family: 'Inter', sans-serif; font-size: 20px; color: #64748b; margin: 0 0 12px 0;">
<strong style="color: #0f172a; display: block; margin-bottom: 4px;">Mata Kuliah</strong>
                Pengujian Perangkat Lunak
            </p>
<p style="font-family: 'Inter', sans-serif; font-size: 20px; color: #64748b; margin: 0 0 12px 0;">
<strong style="color: #0f172a; display: block; margin-bottom: 4px;">Program Studi</strong>
                Informatika
            </p>
<p style="font-family: 'Inter', sans-serif; font-size: 20px; color: #64748b; margin: 0;">
<strong style="color: #0f172a; display: block; margin-bottom: 4px;">Semester</strong>
                6
            </p>
</div>
<!-- Decorative Icon/Graphic on Right Panel -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 950px; top: 280px; width: 200px; height: 200px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<svg fill="#ffffff" style="width: 140px; height: 140px; opacity: 0.9;" viewbox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<!-- Abstract UI/UX Icon -->
<path d="M0 96C0 60.7 28.7 32 64 32H448c35.3 0 64 28.7 64 64V416c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V96zM64 80c-8.8 0-16 7.2-16 16V416c0 8.8 7.2 16 16 16H448c8.8 0 16-7.2 16-16V96c0-8.8-7.2-16-16-16H64zM160 224c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H192c-17.7 0-32-14.3-32-32zm0 128c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H192c-17.7 0-32-14.3-32-32zM96 224a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm32 96a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path>
</svg>
</div>
<!-- Subtle text for aesthetic balance -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 1180px; top: 650px; width: 60px; height: 30px; z-index: 10;">
<p style="font-family: 'Inter', sans-serif; font-size: 14px; color: rgba(255,255,255,0.5); transform: rotate(-90deg);">UX/UI</p>
</div>
<!-- NAVIGATION BUTTONS -->
<div style="
  position: absolute;
  bottom: 24px;
  right: 32px;
  display: flex;
  gap: 16px;
  z-index: 999;
">

    <button onclick="goPrev()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        ← Previous
    </button>

    <button onclick="goNext()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        Next →
    </button>

</div>

<script>
function goPrev() {
    window.location.href = "Slide 1.html";
}

function goNext() {
    window.location.href = "Slide 2.html";
}
</script>
</div>
</body>
</html>
