<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=1280, height=720, initial-scale=1.0" name="viewport"/>
<title>Contoh Metrik Usability</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body { 
 margin: 0;
  padding: 0;
  background-color: #0b1220;
  overflow: auto;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;


		}
        .slide-container { position: relative; width: 1280px; height: 720px;  background-color: #ffffff; }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Decoration: Right Side Abstract Shape -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 800px; top: 0px; width: 480px; height: 720px; z-index: 1;">
<svg fill="none" height="720" viewbox="0 0 480 720" width="480" xmlns="http://www.w3.org/2000/svg">
<path d="M0 0H480V720H100C100 720 0 500 0 360C0 220 100 0 0 0Z" fill="#eff6ff"></path>
<circle cx="350" cy="150" fill="#dbeafe" r="80"></circle>
<circle cx="400" cy="600" fill="#dbeafe" fill-opacity="0.5" r="50"></circle>
</svg>
</div>
<!-- Decorative Top Bar -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 80px; top: 0px; width: 100px; height: 8px; z-index: 5;">
<div style="background-color: #3b82f6; width: 100%; height: 100%; border-radius: 0 0 4px 4px;"></div>
</div>
<!-- Title -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 80px; top: 80px; width: 1000px; height: 80px; z-index: 10;">
<p style="font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 48px; color: #1e3a8a; margin: 0;">Contoh Metrik Usability</p>
</div>
<!-- Subtitle/Lead -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 80px; top: 150px; width: 800px; height: 40px; z-index: 10;">
<p style="font-family: 'Inter', sans-serif; font-weight: 400; font-size: 20px; color: #64748b; margin: 0;">Indikator kuantitatif keberhasilan pengujian</p>
</div>
<!-- List Items Container -->
<!-- Item 1: Success Rate -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 80px; top: 230px; width: 850px; height: 100px; z-index: 2;">
<div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; height: 100%;"></div>
</div>
<div data-object="true" data-object-type="icon" style="position: absolute; left: 110px; top: 250px; width: 60px; height: 60px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<div style="background-color: #dcfce7; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
<i class="fa-solid fa-circle-check" style="font-size: 28px; color: #16a34a;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 200px; top: 250px; width: 700px; height: 60px; z-index: 10; display: flex; align-items: center;">
<p style="font-family: 'Inter', sans-serif; font-weight: 500; font-size: 24px; color: #334155; margin: 0; line-height: 1.4;"><strong style="color: #16a34a; font-size: 28px;">90%</strong> user berhasil <strong>login</strong></p>
</div>
<!-- Item 2: Time on Task -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 80px; top: 360px; width: 850px; height: 100px; z-index: 2;">
<div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; height: 100%;"></div>
</div>
<div data-object="true" data-object-type="icon" style="position: absolute; left: 110px; top: 380px; width: 60px; height: 60px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<div style="background-color: #e0f2fe; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
<i class="fa-solid fa-stopwatch" style="font-size: 28px; color: #0284c7;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 200px; top: 380px; width: 700px; height: 60px; z-index: 10; display: flex; align-items: center;">
<p style="font-family: 'Inter', sans-serif; font-weight: 500; font-size: 24px; color: #334155; margin: 0; line-height: 1.4;">Waktu rata-rata menyelesaikan tugas: <strong style="color: #0284c7; font-size: 28px;">10 detik</strong></p>
</div>
<!-- Item 3: Error Rate -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 80px; top: 490px; width: 850px; height: 100px; z-index: 2;">
<div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; height: 100%;"></div>
</div>
<div data-object="true" data-object-type="icon" style="position: absolute; left: 110px; top: 510px; width: 60px; height: 60px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<div style="background-color: #fee2e2; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
<i class="fa-solid fa-triangle-exclamation" style="font-size: 28px; color: #dc2626;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 200px; top: 510px; width: 700px; height: 60px; z-index: 10; display: flex; align-items: center;">
<p style="font-family: 'Inter', sans-serif; font-weight: 500; font-size: 24px; color: #334155; margin: 0; line-height: 1.4;">Tingkat kesalahan (Error Rate) <strong style="color: #dc2626; font-size: 28px;">&lt; 5%</strong></p>
</div>
<!-- Visual Context Image/Illustration Area (Right Side) - MOVED DOWN slightly to avoid overlap with item 2 and match visual balance -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 980px; top: 400px; width: 220px; height: 220px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<!-- Chart Bar Icon to symbolize Metrics -->
<svg fill="none" height="200" viewbox="0 0 24 24" width="200" xmlns="http://www.w3.org/2000/svg">
<path d="M18 20V10" stroke="#3b82f6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M12 20V4" stroke="#1e3a8a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M6 20V14" stroke="#93c5fd" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M4 20H20" stroke="#cbd5e1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Footer Page Number -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 1180px; top: 680px; width: 80px; height: 30px; z-index: 10; text-align: right;">
<p style="font-family: 'Inter', sans-serif; font-size: 14px; color: #94a3b8; margin: 0;">15</p>
</div>

<!-- NAVIGATION BUTTONS -->
<div style="
  position: absolute;
  bottom: 24px;
  right: 32px;
  display: flex;
  gap: 16px;
  z-index: 999;
">

    <button onclick="goPrev()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        ← Previous
    </button>

    <button onclick="goNext()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        Next →
    </button>

</div>

<script>
function goPrev() {
    window.location.href = "Slide 14.html";
}

function goNext() {
    window.location.href = "Slide 16.html";
}
</script>
</div>
</body>
</html>
