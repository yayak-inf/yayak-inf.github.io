<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=1280, height=720, initial-scale=1.0" name="viewport"/>
<title>Heuristic Evaluation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body { 
		 margin: 0;
  padding: 0;
  background-color: #0b1220;
  overflow: auto;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;

		
		}
        .slide-container { position: relative; width: 1280px; height: 720px;  background-color: #ffffff; }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Accents -->
<!-- Fixed: Adjusted position and size to stay within 1280x720 bounds -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 0px; top: 0px; width: 300px; height: 300px; z-index: 1;">
<svg fill="none" height="300" viewbox="0 0 400 400" width="300" xmlns="http://www.w3.org/2000/svg">
<!-- Translated circle to be visible within the new bounding box context if needed, or keeping generic visual -->
<circle cx="150" cy="150" fill="#eff6ff" fill-opacity="0.5" r="150"></circle>
</svg>
</div>
<!-- Fixed: Adjusted position and size to stay within 1280x720 bounds (Right: 980+300=1280, Bottom: 420+300=720) -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 980px; top: 420px; width: 300px; height: 300px; z-index: 1;">
<svg fill="none" height="300" viewbox="0 0 400 400" width="300" xmlns="http://www.w3.org/2000/svg">
<path d="M200 0L400 200L200 400L0 200L200 0Z" fill="#eff6ff" fill-opacity="0.5"></path>
</svg>
</div>
<!-- Top Bar Line -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 8px; z-index: 1;">
<div style="background-color: #1e3a8a; width: 100%; height: 100%;"></div>
</div>
<!-- Title -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 80px; top: 80px; width: 1120px; height: 80px; z-index: 10; text-align: center;">
<p style="font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 48px; color: #1e3a8a; margin: 0;">Heuristic Evaluation</p>
</div>
<!-- Central Definition Card -->
<!-- Card Background -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 140px; top: 220px; width: 1000px; height: 320px; z-index: 2;">
<div style="background-color: #ffffff; border: 2px solid #e2e8f0; border-left: 10px solid #3b82f6; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; height: 100%;"></div>
</div>
<!-- Icon Area -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 200px; top: 320px; width: 120px; height: 120px; z-index: 10; display: flex; align-items: center; justify-content: center;">
<div style="background-color: #eff6ff; border-radius: 50%; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;">
<i class="fa-solid fa-clipboard-check" style="font-size: 60px; color: #3b82f6;"></i>
</div>
</div>
<!-- Definition Text - Increased height slightly to prevent clipping -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 360px; top: 280px; width: 720px; height: 220px; z-index: 10;">
<p style="font-family: 'Inter', sans-serif; font-weight: 600; font-size: 24px; color: #64748b; margin: 0 0 16px 0; text-transform: uppercase; letter-spacing: 1px;">Definisi</p>
<p style="font-family: 'Inter', sans-serif; font-weight: 500; font-size: 36px; line-height: 1.4; color: #1e3a8a; margin: 0;">
                Evaluasi oleh <span style="color: #3b82f6; font-weight: 700;">expert (ahli)</span> berdasarkan <span style="background-color: #fef3c7; padding: 2px 8px; border-radius: 6px; color: #0f172a;">prinsip usability</span> (heuristik) tanpa keterlibatan user secara langsung.
            </p>
</div>
<!-- Bottom Decoration/Context Note - Moved down slightly for better spacing from card -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 140px; top: 570px; width: 1000px; height: 50px; z-index: 10; text-align: center;">
<p style="font-family: 'Inter', sans-serif; font-weight: 400; font-size: 18px; color: #64748b; margin: 0;">
<i class="fa-solid fa-lightbulb" style="color: #f59e0b; margin-right: 8px;"></i>
                Keuntungan: Lebih hemat biaya dan waktu karena tidak memerlukan rekrutmen responden.
            </p>
</div>
<!-- Footer Page Number -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 1180px; top: 680px; width: 80px; height: 30px; z-index: 10; text-align: right;">
<p style="font-family: 'Inter', sans-serif; font-size: 14px; color: #94a3b8; margin: 0;">12</p>
</div>

<!-- NAVIGATION BUTTONS -->
<div style="
  position: absolute;
  bottom: 24px;
  right: 32px;
  display: flex;
  gap: 16px;
  z-index: 999;
">

    <button onclick="goPrev()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        ← Previous
    </button>

    <button onclick="goNext()" style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#15803d'"
    onmouseout="this.style.backgroundColor='#16a34a'"
    >
        Next →
    </button>

</div>

<script>
function goPrev() {
    window.location.href = "Slide 11.html";
}

function goNext() {
    window.location.href = "Slide 13.html";
}
</script>
</div>
</body>
</html>
