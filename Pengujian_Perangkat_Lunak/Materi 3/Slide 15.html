<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sanity Testing</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background-color: #f3f4f6;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Decorative Elements */
        .top-stripe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background-color: #2D5016;
            z-index: 20;
        }
        
        .right-circle-bg {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 40px solid #F1F8E9;
            z-index: 0;
            opacity: 0.6;
        }

        .left-dots {
            position: absolute;
            bottom: 50px;
            left: 40px;
            font-size: 60px;
            color: #E8F5E9;
            z-index: 0;
            line-height: 0.5;
        }

        /* Header */
        .header-section {
            padding: 50px 80px 20px 80px;
            z-index: 10;
            text-align: center;
        }
        
        .slide-title {
            font-family: 'Poppins', sans-serif;
            font-size: 56px;
            font-weight: 700;
            color: #2D5016;
            margin: 0;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
            gap: 20px;
        }
        
        .title-icon {
            color: #4A7C2F;
            background-color: #E8F5E9;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .slide-subtitle {
            font-family: 'Open Sans', sans-serif;
            font-size: 24px;
            color: #666;
            margin-top: 10px;
            font-weight: 600;
        }

        /* Content Layout */
        .content-wrapper {
            flex: 1;
            padding: 20px 120px 60px 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 50px;
            z-index: 10;
        }

        /* Definition Box */
        .definition-box {
            background-color: #fff;
            border: 2px solid #E8F5E9;
            border-top: 8px solid #4A7C2F;
            border-radius: 16px;
            padding: 40px 50px;
            box-shadow: 0 10px 30px rgba(45, 80, 22, 0.08);
            text-align: center;
            position: relative;
        }
        
        .definition-box::before {
            content: '\f10d';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-color: #4A7C2F;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 4px solid white;
        }

        .def-text {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            color: #333;
            line-height: 1.4;
            font-weight: 600;
            margin: 0;
        }
        
        .highlight {
            color: #2D5016;
            background-color: #F1F8E9;
            padding: 0 10px;
            border-radius: 6px;
        }

        /* Process Visual */
        .process-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        
        .process-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .node-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            position: relative;
        }
        
        .icon-bug { background-color: #FFEBEE; color: #D32F2F; }
        .icon-fix { background-color: #E3F2FD; color: #1976D2; }
        .icon-check { 
            background-color: #2D5016; 
            color: white; 
            width: 100px; 
            height: 100px;
            font-size: 48px;
            box-shadow: 0 8px 20px rgba(45, 80, 22, 0.3);
        }
        
        .node-label {
            font-weight: 700;
            color: #555;
            font-size: 16px;
            text-transform: uppercase;
        }
        
        .arrow-connector {
            flex: 1;
            max-width: 100px;
            height: 4px;
            background-color: #ddd;
            position: relative;
        }
        
        .arrow-connector::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -6px;
            width: 0;
            height: 0;
            border-left: 12px solid #ddd;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }

        /* Footer */
        .footer-info {
            position: absolute;
            bottom: 30px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
        }
        .page-number {
            font-weight: 700;
            color: #2D5016;
            background: #E8F5E9;
            padding: 4px 12px;
            border-radius: 12px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Decorative Elements -->
<div class="top-stripe"></div>
<div class="right-circle-bg"></div>
<div class="left-dots">
<i class="fas fa-ellipsis-v"></i>
<i class="fas fa-ellipsis-v" style="margin-left: 10px;"></i>
</div>
<!-- Header -->
<div class="header-section">
<h1 class="slide-title">
<div class="title-icon">
<i class="fas fa-check-double"></i>
</div>
                Sanity Testing
            </h1>
<p class="slide-subtitle">Verifikasi Perbaikan Bug</p>
</div>
<!-- Main Content -->
<div class="content-wrapper">
<!-- Definition Box -->
<div class="definition-box">
<p class="def-text">
                    "Pengujian cepat untuk memastikan <span class="highlight">bug yang telah diperbaiki</span> benar-benar sudah tidak muncul lagi."
                </p>
</div>
<!-- Process Visual -->
<div class="process-visual">
<!-- Step 1: Bug Report -->
<div class="process-node">
<div class="node-icon icon-bug">
<i class="fas fa-bug"></i>
</div>
<span class="node-label">Bug Found</span>
</div>
<!-- Arrow -->
<div class="arrow-connector"></div>
<!-- Step 2: Fix -->
<div class="process-node">
<div class="node-icon icon-fix">
<i class="fas fa-tools"></i>
</div>
<span class="node-label">Bug Fixed</span>
</div>
<!-- Arrow -->
<div class="arrow-connector" style="background-color: #A8D08D;"></div>
<style>.arrow-connector[style*="A8D08D"]::after { border-left-color: #A8D08D; }</style>
<!-- Step 3: Sanity Check -->
<div class="process-node">
<div class="node-icon icon-check">
<i class="fas fa-check"></i>
</div>
<span class="node-label" style="color: #2D5016; font-size: 18px;">Sanity Pass</span>
</div>
</div>
</div>
<!-- Footer -->
<div class="footer-info">
<span style="font-size: 14px; color: #888;">Jenis-Jenis Pengujian Perangkat Lunak</span>
<div class="page-number">15</div>
</div>
</div>

<!-- Navigation Buttons -->
<div class="absolute bottom-6 right-8 flex gap-4 z-50">

    <!-- Previous Button -->
    <button
        onclick="goPrev()"
        class="flex items-center gap-2 px-5 py-3 bg-brand-teal hover:bg-brand-teal-light rounded-xl text-green font-heading font-semibold transition shadow-lg"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Previous
    </button>

    <!-- Next Button -->
    <button
        onclick="goNext()"
        class="flex items-center gap-2 px-5 py-3 bg-brand-teal hover:bg-brand-teal-light rounded-xl text-green font-heading font-semibold transition shadow-lg"
    >
        Next
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</div>

<script>
    function goPrev() {
        window.location.href = "Slide 14.html"; // ganti sesuai file sebelumnya
    }

    function goNext() {
        window.location.href = "Slide 16.html"; // ganti sesuai file berikutnya
    }
</script>
</body>
</html>
