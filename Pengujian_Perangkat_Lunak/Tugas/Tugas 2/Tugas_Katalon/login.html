<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Sistem</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>
function login(){
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(user === "admin@gmail.com" && pass === "admin123"){
        window.location.href = "dashboard.html";
    }else{
        document.getElementById("error").innerText =
        "Username atau Password salah!";
    }
}
</script>

</head>

<body class="bg-slate-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-xl w-96">

<h2 class="text-2xl font-bold text-center mb-6">
Login Sistem Pembayaran
</h2>

<input id="username" type="email"
placeholder="Username"
class="w-full border p-3 rounded mb-3">

<input id="password" type="password"
placeholder="Password"
class="w-full border p-3 rounded mb-3">

<button onclick="login()"
class="w-full bg-teal-600 text-white py-3 rounded hover:bg-teal-700">
Login
</button>

<p id="error" class="text-red-600 mt-3 text-sm"></p>

<hr class="my-5">

<div class="text-sm text-slate-600">
<b>Akun Testing:</b><br>
Username : <span class="font-semibold">admin@gmail.com</span><br>
Password : <span class="font-semibold">admin123</span>
</div>

</div>

</body>
</html>
