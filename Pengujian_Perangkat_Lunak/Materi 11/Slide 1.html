<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bug Tracking dan Manajemen Defect - Cover</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Roboto:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
			margin: 0;
			background: #1a1a1a;
			font-family: 'Inter', sans-serif;
			overflow: auto;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh; /* lebih aman */	
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #1E3A8A; /* Blue 900 */
            position: relative;
           
            display: flex;
            flex-direction: row;
        }
        .accent-circle-1 {
            position: absolute;
            top: -150px;
            right: -150px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background-color: #2563EB; /* Blue 600 */
            opacity: 0.2;
        }
        .accent-circle-2 {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background-color: #3B82F6; /* Blue 500 */
            opacity: 0.1;
        }
        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="slide-container text-white">
<!-- Background Elements -->
<div class="accent-circle-1"></div>
<div class="accent-circle-2"></div>
<div class="grid-pattern" style="background-image: none; opacity: 0.1;">
<!-- Fallback for gradient restriction: using SVG pattern -->
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<circle cx="2" cy="2" fill="white" r="1"></circle>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Main Content Area -->
<div class="flex flex-col justify-center w-8/12 pl-24 pr-10 z-10 h-full">
<!-- Top Tag -->
<div class="flex items-center mb-6">
<div class="bg-blue-500 text-white px-4 py-1 rounded-full text-sm font-bold tracking-wider uppercase shadow-lg">
<p>Pertemuan 11</p>
</div>
</div>
<!-- Title -->
<div class="mb-8">
<h1 class="text-7xl font-extrabold leading-tight tracking-tight mb-2 font-inter text-white">
                    Bug Tracking <br/>
<span class="text-blue-300">&amp;&amp;</span> Manajemen Defect
                </h1>
<div class="h-2 w-32 bg-blue-400 mt-6 rounded-full"></div>
</div>
<!-- Course Details -->
<div class="grid grid-cols-1 gap-4 text-blue-100 font-roboto mt-4">
<div class="flex items-center">
<div class="w-10 h-10 bg-blue-800 rounded-lg flex items-center justify-center mr-4 shadow-md">
<i class="fas fa-book text-blue-300"></i>
</div>
<div>
<p class="text-xs uppercase tracking-wide text-blue-400">Mata Kuliah</p>
<p class="text-xl font-semibold">Pengujian Perangkat Lunak</p>
</div>
</div>
<div class="flex items-center">
<div class="w-10 h-10 bg-blue-800 rounded-lg flex items-center justify-center mr-4 shadow-md">
<i class="fas fa-university text-blue-300"></i>
</div>
<div>
<p class="text-xs uppercase tracking-wide text-blue-400">Program Studi</p>
<p class="text-xl font-semibold">Informatika</p>
</div>
</div>
<div class="flex items-center">
<div class="w-10 h-10 bg-blue-800 rounded-lg flex items-center justify-center mr-4 shadow-md">
<i class="fas fa-calendar-alt text-blue-300"></i>
</div>
<div>
<p class="text-xs uppercase tracking-wide text-blue-400">Semester</p>
<p class="text-xl font-semibold">6</p>
</div>
</div>
</div>
</div>
<!-- Right Visual Area -->
<div class="w-4/12 h-full flex items-center justify-center relative z-10 bg-blue-800 bg-opacity-30 backdrop-filter backdrop-blur-sm border-l border-blue-700">
<div class="flex flex-col items-center justify-center text-center p-10">
<div class="relative mb-8">
<div class="absolute inset-0 bg-blue-500 blur-2xl opacity-20 rounded-full"></div>
<i class="fas fa-bug text-9xl text-white relative z-10 drop-shadow-2xl"></i>
<i class="fas fa-search text-6xl text-blue-300 absolute -bottom-4 -right-4 z-20 drop-shadow-lg transform rotate-12"></i>
</div>
<div class="bg-blue-900 bg-opacity-80 p-6 rounded-xl border border-blue-700 shadow-xl w-full max-w-xs">
<div class="flex justify-between items-center border-b border-blue-700 pb-3 mb-3">
<p class="text-xs font-mono text-blue-300">BUG_ID: #404</p>
<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
</div>
<div class="space-y-2">
<div class="h-2 bg-blue-700 rounded w-3/4"></div>
<div class="h-2 bg-blue-700 rounded w-full"></div>
<div class="h-2 bg-blue-700 rounded w-5/6"></div>
</div>
<div class="mt-4 flex justify-end">
<div class="px-3 py-1 bg-blue-600 rounded text-xs font-bold text-white">TRACKING...</div>
</div>
</div>
</div>
</div>

<!-- NAVIGATION BUTTONS -->
<div class="absolute bottom-6 right-8 flex gap-4 z-50">

    <button
        onclick="goPrev()"
        class="flex items-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-heading font-semibold transition duration-300 shadow-lg hover:shadow-xl"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Previous
    </button>

    <button
        onclick="goNext()"
        class="flex items-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-heading font-semibold transition duration-300 shadow-lg hover:shadow-xl"
    >
        Next
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</div>

<script>
function goPrev() {
    window.location.href = "Slide 1.html";
}
function goNext() {
    window.location.href = "Slide 2.html";
}
</script>
</div>
</body>
</html>
