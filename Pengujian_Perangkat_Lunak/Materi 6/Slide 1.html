<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>System Testing dan Acceptance Testing</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .hero-pattern {
            background-color: #1e3a8a; /* Navy Blue */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
            /* Fallback for no-gradient rule: solid color used, but subtle SVG pattern overlay simulated with clip-path or simple shapes */
        }
        .accent-bar {
            background-color: #10b981; /* Green Accent */
        }
        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Main Background with geometric shapes -->
<div class="absolute inset-0 bg-white">
<!-- Left Blue Section -->
<div class="absolute top-0 left-0 w-2/3 h-full bg-blue-900" style="clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);"></div>
<!-- Decorative Circles -->
<div class="absolute top-20 right-20 w-64 h-64 border-4 border-blue-100 rounded-full opacity-20"></div>
<div class="absolute bottom-10 right-40 w-32 h-32 bg-green-400 rounded-full opacity-10"></div>
<div class="absolute top-40 left-10 w-24 h-24 border-2 border-white rounded-full opacity-10"></div>
</div>
<!-- Content Content -->
<div class="relative z-10 flex flex-col justify-center h-full px-20 text-white w-2/3">
<div class="mb-6">
<span class="inline-block px-3 py-1 bg-green-500 text-white text-sm font-semibold tracking-wider rounded-sm mb-4">PERTEMUAN 6</span>
<div class="w-20 h-1 bg-green-400 mb-6"></div>
<h1 class="text-6xl font-bold leading-tight mb-2">System Testing</h1>
<h1 class="text-6xl font-bold leading-tight text-blue-200">Acceptance Testing</h1>
</div>
<div class="mt-8 space-y-2 opacity-90">
<p class="text-xl font-light"><span class="font-semibold text-green-300">Mata Kuliah:</span> Pengujian Perangkat Lunak</p>
<p class="text-lg"><span class="font-semibold text-blue-300">Program Studi:</span> Informatika</p>
<p class="text-lg"><span class="font-semibold text-blue-300">Semester:</span> 6</p>
</div>
</div>
<!-- Right Side Visual Element (Abstract Tech Representation) -->
<div class="absolute right-0 top-0 w-1/3 h-full flex items-center justify-center pointer-events-none">
<div class="relative w-full h-full p-12 flex flex-col justify-center items-center">
<!-- Simple SVG Illustration for Testing/Quality -->
<svg fill="none" height="240" viewbox="0 0 240 240" width="240" xmlns="http://www.w3.org/2000/svg">
<circle cx="120" cy="120" opacity="0.6" r="110" stroke="#E0F2FE" stroke-dasharray="8 8" stroke-width="2"></circle>
<circle cx="120" cy="120" opacity="0.3" r="80" stroke="#3B82F6" stroke-width="4"></circle>
<!-- Checkmark Shield Icon -->
<path d="M120 40C75.8172 40 40 75.8172 40 120C40 164.183 75.8172 200 120 200C164.183 200 200 164.183 200 120C200 75.8172 164.183 40 120 40Z" fill="#EFF6FF"></path>
<path d="M120 50C158.66 50 190 81.3401 190 120C190 158.66 158.66 190 120 190C81.3401 190 50 158.66 50 120C50 81.3401 81.3401 50 120 50Z" stroke="#3B82F6" stroke-width="8"></path>
<!-- Checkmark -->
<path d="M85 120L110 145L155 100" stroke="#10B981" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
</svg>
<div class="mt-8 text-center text-gray-500 font-medium">
<p class="text-sm">Quality Assurance Phase</p>
<p class="text-xs mt-1 text-gray-400">Software Development Life Cycle</p>
</div>
</div>
</div>
<!-- Footer Strip -->
<div class="absolute bottom-0 w-full h-3 bg-blue-800 flex">
<div class="w-1/3 bg-green-500 h-full"></div>
<div class="w-2/3 bg-blue-900 h-full"></div>
</div>

<!-- NAVIGATION BUTTONS (BOTTOM CENTER) -->
<div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex gap-4 z-50">

<button onclick="goPrev()"
class="flex items-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold shadow-lg transition">
<i class="fa-solid fa-arrow-left"></i>
Previous
</button>

<button onclick="goNext()"
class="flex items-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold shadow-lg transition">
Next
<i class="fa-solid fa-arrow-right"></i>
</button>

</div>
<script> 
function goPrev(){
 window.location.href="Slide 1.html"; 
 } 
 function goNext(){ 
 window.location.href="Slide 2.html"; 
 } 
 </script>

</div>
</body>
</html>
